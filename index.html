<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerSchool Mockup</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 20px;
            border-bottom: 1px solid #d1d1d1;
        }

        .logo-area {
            display: flex;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #3aa0ff; /* Light blue P logo */
            margin-right: 10px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #444;
        }

        .lang {
            font-size: 16px;
            color: #666;
        }

        /* Center content */
        .center-box {
            margin: 80px auto;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        /* Image drop-in area */
        .img-area {
            width: 100;
            height: 300px;
            background: #e6eef5;
            border: 2px dashed #a8c4dd;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6d8fa8;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo">P</div>
            <div class="title">PowerSchool</div>
        </div>
        <div class="lang">English</div>
    </div>

    <!-- Center Content -->
    <div class="center-box">

        <!-- IMAGE DROP AREA -->
        <div class="img-area">
            <img src="file:///Users/pushpampatel/Desktop/Student%20Report%20Card:IEP%20copy.png" style="max-width:100%; max-height:125%; border-radius:8px;">
        </div>
        <!-- END IMAGE AREA -->

    </div>

    <div class="footer">
        © 2025 · PowerSchool (25.1001)
    </div>

</body>
</html>
